<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila.js — Micro-Framework Demo</title>
    <meta name="description" content="Lila.js lightweight reactive engine & SPA router demo for LilaPHP.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .nav-cart-badge {
            background: rgba(167, 139, 250, 0.2);
            border: 1px solid rgba(167, 139, 250, 0.4);
            color: #a78bfa;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-banner {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .counter-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .counter-value {
            font-size: 2rem;
            font-weight: 700;
            min-width: 3rem;
            text-align: center;
            font-family: 'Fira Code', monospace;
            color: #a78bfa;
        }

        .muted {
            color: #64748b;
            font-size: 0.9rem;
        }

        .input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.5rem;
            color: #f8fafc;
            font-size: 1rem;
            margin-top: 0.75rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input:focus {
            border-color: #a78bfa;
        }

        .greeting {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 0.5rem;
            color: #e2e8f0;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.5rem;
        }

        .product-emoji {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .price {
            font-weight: 700;
            color: #34d399;
            font-size: 1.2rem;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
        }

        .cart-item-icon {
            font-size: 1.5rem;
        }

        .cart-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .cart-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-total {
            font-size: 1.25rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #64748b;
        }

        .empty-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.35);
        }

        .btn-outline {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .btn-outline:hover {
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <header class="navbar">
        <div class="container navbar-content">
            <div class="brand">
                <span class="brand-badge">⚡ Lila.js v2.0</span>
                <h1 class="brand-title">Lila<span class="accent">.js</span></h1>
            </div>
            <nav class="nav-links">
                <a href="#/" data-link class="nav-link">Home</a>
                <a href="#/products" data-link class="nav-link">Products</a>
                <a href="#/cart" data-link class="nav-link flex-center">
                    Cart <span id="cart-count" class="nav-cart-badge">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div id="app"></div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>© 2026 LilaPHP Engine. Powered by Lila.js lightweight reactivity.</p>
        </div>
    </footer>

    <script src="js/lila.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
