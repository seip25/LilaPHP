services:
  nginx:
    image: nginx:alpine
    container_name: lilaphp-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - php
    networks:
      - lila-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.${APP_ENV:-dev}
    container_name: lilaphp-fpm
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lila-network

  mysql:
    image: mysql:8.0
    container_name: lilaphp-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lilaphp}
      MYSQL_USER: ${DB_USER:-lila}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lila-network

  redis:
    image: redis:7-alpine
    container_name: lilaphp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - lila-network

networks:
  lila-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
