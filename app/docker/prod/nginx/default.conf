server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    charset utf-8;

    location = /favicon.ico { 
        log_not_found off;
        access_log off; 
    }
    location = /robots.txt  { 
        log_not_found off;
        access_log off; 
    }

    # Block access to framework internals and sensitive files
    location ~ ^/(app|vendor|node_modules|composer\.(json|lock)|package\.(json|lock)|vite\.config\.js|\.env|\.git|\.gitignore|README\.md|LICENSE) {
        deny all;
        return 404;
    }

    # Traditional routing with language prefix support
    location / {
        # Strip language prefix internally (e.g. /es/login -> /login, /pt-br -> /)
        rewrite "^/([a-z]{2,3}(?:-[a-z]{2})?)/(.*)$" /$2 last;
        rewrite "^/([a-z]{2,3}(?:-[a-z]{2})?)$" / last;

        try_files $uri $uri/ @extensionless-php;
    }

    location @extensionless-php {
        rewrite ^(.*)$ $1.php last;
    }

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        fastcgi_read_timeout 60;
        fastcgi_intercept_errors on;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Caching headers for static assets (production optimized)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log off;
    }
}
