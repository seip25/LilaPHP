
services:
  web:
    build:
      context: ../../../
      dockerfile: app/docker/prod/nginx/Dockerfile
    container_name: lilaphp_prod_web
    ports:
      - "80:80"
    depends_on:
      - php
      - db
    networks:
      - lilaphp_prod_network

  php:
    build:
      context: ../../../
      dockerfile: app/docker/prod/php/Dockerfile
    container_name: lilaphp_prod_php
    environment:
      - APP_ENV=production
    depends_on:
      - db
    networks:
      - lilaphp_prod_network

  db:
    image: mysql:8.0
    container_name: lilaphp_prod_db
    environment:
      MYSQL_ROOT_PASSWORD: production_root_password
      MYSQL_DATABASE: lila
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - lilaphp_prod_network

volumes:
  mysql_prod_data:

networks:
  lilaphp_prod_network:
    driver: bridge
