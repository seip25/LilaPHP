services:
  web:
    image: nginx:alpine
    container_name: lilaphp_dev_web
    ports:
      - "8000:80"
    volumes:
      - ../../../:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - db
    networks:
      - lilaphp_network

  php:
    build:
      context: ./php
    container_name: lilaphp_dev_php
    volumes:
      - ../../../:/var/www/html:cached
    networks:
      - lilaphp_network

  db:
    image: mysql:8.0
    container_name: lilaphp_dev_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lila
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - lilaphp_network

volumes:
  mysql_dev_data:

networks:
  lilaphp_network:
    driver: bridge
