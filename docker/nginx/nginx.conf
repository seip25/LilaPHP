user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

    client_body_buffer_size 128k;
    client_max_body_size    20m;  
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    server {
        listen 80;
        server_name _;
        root /var/www/html/frontend;
        index index.html;
        
                location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(config|ini|log|conf|sql|bak|yaml|yml)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            try_files $uri $uri.html $uri/ $uri/index.html /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Powered-By "LilaPHP";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            add_header X-LilaPHP-Cache "HIT";
            access_log off;
        }

        # Optional: Protect admin area via Nginx auth_request subrequest before serving HTML
        # location /admin/ {
        #     auth_request /api/auth;
        #     error_page 401 = @login_redirect;
        #     try_files $uri $uri.html $uri/ /admin/index.html;
        # }
        # location @login_redirect {
        #     return 302 /login;
        # }

        # Real-time WebSocket proxy to Workerman server (`php cli.php ws:serve`)
        # location /ws {
        #     proxy_pass http://php:8001;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "Upgrade";
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_read_timeout 3600s;
        #     proxy_send_timeout 3600s;
        # }

        location ^~ /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;

            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PHP_VALUE "auto_prepend_file=/var/www/html/_core/bootstrap.php";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        location @json_404 {
            default_type application/json;
            return 404 '{"error":"Endpoint not found","code":404}';
        }

        location @json_429 {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded at Nginx level","code":429}';
        }

        error_page 404 = @json_404;
        error_page 429 = @json_429;
        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 500 '{"error":"Internal Server Error","code":500}';
        }
    }
}
