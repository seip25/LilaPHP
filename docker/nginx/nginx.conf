user nginx;
worker_processes auto;
worker_rlimit_nofile 16384;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_body_buffer_size 128k;
    client_max_body_size    20m;  
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.html index.php;
        
        location ~ ^/frontend/src/ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(config|ini|log|conf|sql|bak|yaml|yml)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = /debug {
            alias /var/www/html/_core/routes/frontend/debug.html;
            default_type text/html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location = /debug.html {
            alias /var/www/html/_core/routes/frontend/debug.html;
            default_type text/html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Frontend SPA routes handled client-side by React Router
        location / {
            try_files $uri $uri/ /frontend/index.html /index.php?$query_string;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Powered-By "LilaPHP";
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param PHP_VALUE "auto_prepend_file=/var/www/html/_core/bootstrap.php";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            add_header X-LilaPHP-Cache "HIT";
            access_log off;
        }

        # Dedicated Backend API Engine (Decoupled PHP backend with APCu/Redis route caching)
        location ^~ /api/ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PHP_VALUE "auto_prepend_file=/var/www/html/_core/bootstrap.php";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        location @json_404 {
            default_type application/json;
            return 404 '{"error":"Endpoint not found","code":404}';
        }

        location @json_429 {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded at Nginx level","code":429}';
        }

        error_page 404 = @json_404;
        error_page 429 = @json_429;
        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 500 '{"error":"Internal Server Error","code":500}';
        }
    }
}
