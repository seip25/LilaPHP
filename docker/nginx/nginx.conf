user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens  off;

    client_body_buffer_size 128k;
    client_max_body_size    25m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|config|ini|log|conf|sql|bak|yaml|yml|sqlite|sqlite3|db)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(?:css|js)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
            try_files $uri =404;
        }

        location = /api {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        location ^~ /api/ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ @php;
        }

        location @php {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 500 '{"error":true,"code":500,"message":"Internal Server Error"}';
        }
    }
}
