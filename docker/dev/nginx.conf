server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www;

    # Handle all requests through the Front Controller (root index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to .env and sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
    }
    
    # Deny direct access to the framework core
    location /LilaPHP {
        deny all;
    }

    # Allow public assets inside LilaPHP (if they are there)
    # location /LilaPHP/assets {
    #     allow all;
    # }
}
