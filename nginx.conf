# ==============================================================================
# LilaPHP - Master Nginx Configuration (Bare-Metal & Reverse-Proxy Setup)
# ==============================================================================
# Architecture:
# - Frontend: Pure static files (HTML, CSS, JS) served directly from root
# - Backend API: Routed strictly under `/api` and `/api/*` to PHP-FPM FastCGI
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens  off;

    # Buffers & Request limits
    client_body_buffer_size 128k;
    client_max_body_size    25m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Root points directly to the frontend static directory
        root /var/www/html/frontend;
        index index.html;

        # ----------------------------------------------------------------------
        # Security: Block hidden files and sensitive configuration files
        # ----------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|config|ini|log|conf|sql|bak|yaml|yml|sqlite|sqlite3|db)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ----------------------------------------------------------------------
        # Static Binary Assets Caching (Images, Fonts, Icons)
        # Long-lived immutable cache — safe because these are fingerprinted/versioned
        # ----------------------------------------------------------------------
        location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # JS & CSS: Short cache with revalidation (no immutable — may be updated)
        # HTML is intentionally excluded — handled by frontend routing below
        # ----------------------------------------------------------------------
        location ~* \.(?:css|js)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Backend REST API Engine (PHP-FPM)
        # Strict isolation: /api/ and exact /api (does not match /apiary or /apikeys)
        # ----------------------------------------------------------------------
        # Exact match for /api (no trailing slash)
        location = /api {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/backend/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            # No Nginx-level cache — API responses cached by PHP APCu/Redis
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        # All /api/* routes — PHP manages caching internally (APCu, Redis, sessions, JWT)
        location ^~ /api/ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/backend/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            # No Nginx-level cache — API responses cached by PHP APCu/Redis
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Frontend Routing: Direct HTML files, Directory Index, or SPA Fallback
        # HTML files are never cached — always revalidated by the browser
        # ----------------------------------------------------------------------
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            try_files $uri $uri.html $uri/ /index.html =404;
        }

        # ----------------------------------------------------------------------
        # Error Handlers
        # ----------------------------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 500 '{"error":true,"code":500,"message":"Internal Server Error"}';
        }
    }
}
